<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#fff;overflow:hidden}
svg{display:block}
.cap{font-family:'Inter','Inter Display',sans-serif;font-weight:900}
</style></head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
/*CHARS*/
/*WORDS*/
const W = 1920, H = 1080;
const RAIN = ['#FF4D4D','#FF9F1C','#FFE14D','#4CD964','#3FA9F5','#4B4BD8','#A35BE0'];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => eBack(prog(t, a, a + d));

// who is speaking (Blu lines), for talking bounce
const BLU_LINES = [[0.3, 3.95], [26.4, 27.8], [49.35, 51.7]];
const speaking = (who, t) => {
  const blu = BLU_LINES.some(([a, b]) => t >= a && t <= b);
  if (who === 'blu') return blu;
  return !blu && WORDS.some(w => t >= w.s - .05 && t <= w.e + .05);
};
const wordActive = t => WORDS.some(w => t >= w.s && t <= w.e);

// ---------- character ----------
function ch(name, x, y, size, t, o = {}) {
  const who = name.startsWith('blu') ? 'blu' : 'sunny';
  let sy = 1 + 0.012 * Math.sin(t * 3.1 + (who === 'blu' ? 0 : 1.7));
  let rot = o.rot || 0;
  if (speaking(who, t) && wordActive(t)) { sy += 0.035 * Math.abs(Math.sin(t * 16)); rot += 1.6 * Math.sin(t * 8); }
  const sx = (o.flip ? -1 : 1) * (1 / Math.sqrt(sy)) * (o.s || 1);
  sy *= (o.s || 1);
  const op = o.op == null ? 1 : o.op;
  return `<g opacity="${op}" transform="translate(${x},${y}) rotate(${rot}) scale(${sx},${sy})">
    <svg x="${-size / 2}" y="${-size * 0.95}" width="${size}" height="${size}" viewBox="0 0 1024 1024" overflow="visible">${CHARS[name]}</svg></g>`;
}

// ---------- backgrounds ----------
function bgHill(t, rainbowK = 1) {
  let s = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ED8FF"/><stop offset="1" stop-color="#E9F7FF"/></linearGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  // clouds
  [[300, 170, 1], [1500, 130, .8], [1050, 240, .6]].forEach(([cx, cy, k], i) => {
    const dx = ((t * 12 * (i + 1)) % 2400) - 200;
    const X = ((cx + dx) % 2300) - 150;
    s += `<g transform="translate(${X},${cy}) scale(${k})" fill="#fff" opacity=".95"><ellipse cx="0" cy="0" rx="90" ry="45"/><ellipse cx="70" cy="-25" rx="70" ry="50"/><ellipse cx="140" cy="5" rx="80" ry="40"/></g>`;
  });
  // rainbow arcs
  const R0 = 760, bw = 34;
  RAIN.forEach((c, i) => {
    const r = R0 - i * bw;
    const len = Math.PI * r;
    s += `<path d="M ${960 - r} 980 A ${r} ${r} 0 0 1 ${960 + r} 980" fill="none" stroke="${c}" stroke-width="${bw + 1}" opacity=".85" stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - rainbowK)}"/>`;
  });
  // hills
  s += `<ellipse cx="420" cy="1160" rx="900" ry="330" fill="#7ED36B"/><ellipse cx="1550" cy="1180" rx="900" ry="320" fill="#6CC85A"/>
        <ellipse cx="960" cy="1240" rx="1300" ry="330" fill="#8BDD77"/>`;
  // puddles + flowers
  s += `<ellipse cx="380" cy="1010" rx="110" ry="18" fill="#BDE7FF" opacity=".9"/><ellipse cx="1600" cy="1030" rx="90" ry="15" fill="#BDE7FF" opacity=".9"/>`;
  [[200, 960, '#FF6FA8'], [520, 990, '#FFD23F'], [1380, 985, '#FF6FA8'], [1720, 960, '#FFFFFF']].forEach(([x, y, c]) => {
    s += `<g transform="translate(${x},${y})"><circle r="9" fill="${c}"/><circle r="4" fill="#FFB400"/></g>`;
  });
  return s;
}
function bgStage(c1 = '#FFF7E8', c2 = '#FFE9CC') {
  return `<defs><radialGradient id="st" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#st)"/>
  <ellipse cx="960" cy="1000" rx="1100" ry="90" fill="#000" opacity=".05"/>
  ${[...Array(14)].map((_, i) => `<circle cx="${(i * 157) % 1920}" cy="${(i * 263) % 760 + 60}" r="${4 + (i % 3) * 3}" fill="#FFC56B" opacity=".25"/>`).join('')}`;
}
function sunIcon(x, y, r, t) {
  let s = `<g transform="translate(${x},${y})"><g transform="rotate(${t * 20})">`;
  for (let i = 0; i < 12; i++) s += `<rect x="${r + 12}" y="-7" width="46" height="14" rx="7" fill="#FFC21A" transform="rotate(${i * 30})"/>`;
  s += `</g><circle r="${r}" fill="#FFD84A" stroke="#F2A900" stroke-width="8"/>
    <ellipse cx="-${r * .35}" cy="-${r * .1}" rx="10" ry="16" fill="#3A2A00"/><ellipse cx="${r * .35}" cy="-${r * .1}" rx="10" ry="16" fill="#3A2A00"/>
    <path d="M -${r * .4} ${r * .25} Q 0 ${r * .6} ${r * .4} ${r * .25}" fill="none" stroke="#3A2A00" stroke-width="7" stroke-linecap="round"/></g>`;
  return s;
}
function gradientDefs(id, x1 = 0, x2 = 1) {
  return `<linearGradient id="${id}" x1="${x1}" y1="0" x2="${x2}" y2="0">${RAIN.map((c, i) => `<stop offset="${i / 6}" stop-color="${c}"/>`).join('')}</linearGradient>`;
}
function speechBubble(x, y, text, k, fs = 70, fill = '#fff') {
  const w = text.length * fs * 0.62 + 70;
  return `<g transform="translate(${x},${y}) scale(${k})"><rect x="${-w / 2}" y="-70" width="${w}" height="120" rx="60" fill="${fill}" stroke="#111" stroke-width="7"/>
   <path d="M -20 46 L 0 95 L 25 46" fill="${fill}" stroke="#111" stroke-width="7" stroke-linejoin="round"/><rect x="-24" y="40" width="54" height="14" fill="${fill}"/>
   <text class="cap" x="0" y="15" text-anchor="middle" font-size="${fs}" fill="#111">${text}</text></g>`;
}

// ---------- scenes ----------
const SCENES = [
  { a: 0, b: 4.1, f: s1 }, { a: 4.1, b: 7.75, f: s2 }, { a: 7.75, b: 12.2, f: s3 }, { a: 12.2, b: 18.75, f: s4 },
  { a: 18.75, b: 26.25, f: s5 }, { a: 26.25, b: 28.05, f: s6 }, { a: 28.05, b: 34.65, f: s7 }, { a: 34.65, b: 39.8, f: s8 },
  { a: 39.8, b: 49.2, f: s9 }, { a: 49.2, b: 99, f: s10 },
];
function cam(inner, k, cx = 960, cy = 540) { return `<g transform="translate(${cx},${cy}) scale(${k}) translate(${-cx},${-cy})">${inner}</g>`; }

function s1(t, a, b) {
  const p = prog(t, a, b);
  let s = bgHill(t, eOut(prog(t, 0.1, 1.6)));
  s += ch('blu_think', 960, 1000, 640, t, { rot: 3 * Math.sin(t * 2) });
  // floating question marks
  const q = pop(t, 2.0);
  s += `<g opacity="${clamp(q)}"><text class="cap" x="1190" y="${380 - 10 * Math.sin(t * 3)}" font-size="${110 * q}" fill="#3FA9F5" stroke="#111" stroke-width="5">?</text>
        <text class="cap" x="1270" y="${300 - 10 * Math.sin(t * 3 + 1)}" font-size="${80 * q}" fill="#FF4D4D" stroke="#111" stroke-width="4">?</text></g>`;
  return cam(s, 1 + 0.06 * eInOut(p), 960, 700);
}
function s2(t, a, b) {
  let s = bgHill(t, 1);
  s += ch('blu_wave', 640, 1000, 560, t, { rot: -4 });
  const k = pop(t, a, .6);
  const sx = lerp(2300, 1280, eBack(prog(t, a, a + .6)));
  s += ch('sunny_point', sx, 1000, 600, t);
  // "7 ?" stamp + red X at "It DOESN'T"
  const k2 = pop(t, 6.35, .35);
  if (t > 6.3) s += `<g transform="translate(960,330) scale(${k2}) rotate(-8)"><circle r="120" fill="#fff" stroke="#111" stroke-width="8"/><text class="cap" x="0" y="55" text-anchor="middle" font-size="170" fill="#111">7</text>
     <path d="M -110 -110 L 110 110 M 110 -110 L -110 110" stroke="#E8262B" stroke-width="28" stroke-linecap="round"/></g>`;
  // surprise lines on Blu
  if (t > 4.4) s += `<g stroke="#111" stroke-width="7" stroke-linecap="round" opacity="${clamp((t - 4.4) * 3)}"><path d="M 470 420 l -40 -30"/><path d="M 460 480 l -55 0"/><path d="M 820 420 l 40 -30"/></g>`;
  return s;
}
function s3(t, a, b) {
  const p = prog(t, a, b);
  let s = bgStage();
  s += sunIcon(220, 210, 95, t);
  // beam
  const bk = eOut(prog(t, a + .2, a + 1.2));
  const ex = lerp(300, 1250, bk);
  s += `<defs><linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter></defs>
        <polygon points="270,170 270,250 ${ex},${lerp(250, 640, bk)} ${ex},${lerp(170, 400, bk)}" fill="#fff" filter="url(#glow)" opacity=".9"/>
        <polygon points="270,185 270,235 ${ex},${lerp(235, 610, bk)} ${ex},${lerp(185, 430, bk)}" fill="url(#beam)"/>`;
  // colour sparkles inside the beam (intensify at "every color")
  const n = t > 10.3 ? 40 : 18;
  for (let i = 0; i < n; i++) {
    const u = ((t * 0.35 + i * 0.137) % 1);
    const x = lerp(300, ex, u);
    const yc = lerp(210, lerp(210, 520, bk), (x - 270) / Math.max(1, ex - 270));
    const y = yc + Math.sin(i * 7.1 + t * 3) * lerp(15, 70, (x - 270) / 1000);
    const r = 6 + (i % 4) * 2 + (t > 10.3 ? 3 : 0);
    if (x < ex) s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${RAIN[i % 7]}" opacity="${t > 10.3 ? 1 : .55}"/>`;
  }
  s += ch('sunny_present', 1480, 1000, 620, t);
  return cam(s, 1 + 0.04 * p);
}
function s4(t, a, b) {
  let s = bgStage('#EEF8FF', '#D7EEFF');
  const cx = 860, cy = 470, r = 230;
  // incoming white beam
  const k1 = eOut(prog(t, a + .1, a + 1.0));
  s += `<polygon points="0,${cy - 40} 0,${cy + 10} ${lerp(0, cx - r + 20, k1)},${cy + 20} ${lerp(0, cx - r + 20, k1)},${cy - 20}" fill="#fff" stroke="#CFE6F7" stroke-width="3"/>`;
  // fan out of colours: grows from "bends" (14.8) to "spreads" (17.4)
  const k2 = eOut(prog(t, 14.8, 17.6));
  RAIN.forEach((c, i) => {
    const ang = (-14 + i * 6.5) * Math.PI / 180, ang2 = (-14 + (i + 1) * 6.5) * Math.PI / 180;
    const L = lerp(0, 1000, k2), x0 = cx + r - 30, y0 = cy + 10;
    s += `<polygon points="${x0},${y0} ${x0 + L * Math.cos(ang)},${y0 + L * Math.sin(ang)} ${x0 + L * Math.cos(ang2)},${y0 + L * Math.sin(ang2)}" fill="${c}" opacity=".9"/>`;
  });
  // raindrop
  const dk = pop(t, a, .6);
  s += `<defs><radialGradient id="drop" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#D9F1FF"/><stop offset="1" stop-color="#8FD0FF"/></radialGradient></defs>
    <g transform="translate(${cx},${cy + 8 * Math.sin(t * 2)}) scale(${dk})">
      <path d="M 0 ${-r * 1.45} C ${r * .55} ${-r * .7} ${r} ${-r * .2} ${r} ${r * .25} A ${r} ${r} 0 0 1 ${-r} ${r * .25} C ${-r} ${-r * .2} ${-r * .55} ${-r * .7} 0 ${-r * 1.45} Z" fill="url(#drop)" stroke="#5BB6F0" stroke-width="8" opacity=".95"/>
      <ellipse cx="${-r * .4}" cy="${-r * .25}" rx="34" ry="60" fill="#fff" opacity=".85" transform="rotate(25 ${-r * .4} ${-r * .25})"/>
      <circle cx="${-r * .1}" cy="${-r * .65}" r="14" fill="#fff" opacity=".9"/>
    </g>`;
  // tiny prism label at "tiny prism"
  const pk = pop(t, 16.3, .4);
  if (t > 16.2) s += `<g transform="translate(${cx},${cy + r + 130}) scale(${pk})"><polygon points="0,-60 70,55 -70,55" fill="#E9F7FF" stroke="#111" stroke-width="7" stroke-linejoin="round"/></g>`;
  s += ch('sunny_point', 1680, 1040, 440, t, { flip: true });
  return s;
}
function s5(t, a, b) {
  let s = bgStage();
  s += `<defs>${gradientDefs('rg')}</defs>`;
  const x0 = 260, x1 = 1660, y = 330, h = 170, bw = (x1 - x0) / 7;
  const morph = eInOut(prog(t, 21.55, 22.6));
  // seven boxes (fade out as they melt)
  RAIN.forEach((c, i) => {
    const k = pop(t, a + i * .1, .35);
    const gap = lerp(18, 0, morph);
    s += `<g transform="translate(${x0 + bw * i + bw / 2},${y + h / 2}) scale(${k})" opacity="${1 - morph}">
      <rect x="${-bw / 2 + gap / 2}" y="${-h / 2}" width="${bw - gap}" height="${h}" rx="18" fill="${c}" stroke="#111" stroke-width="6"/></g>`;
  });
  // red X on "isn't seven boxes"
  const xk = pop(t, 20.4, .3);
  if (t > 20.3 && t < 21.8) s += `<g opacity="${1 - prog(t, 21.4, 21.8)}" transform="translate(960,${y + h / 2}) scale(${xk})"><path d="M -300 -140 L 300 140 M 300 -140 L -300 140" stroke="#E8262B" stroke-width="34" stroke-linecap="round"/></g>`;
  // smooth gradient ribbon
  s += `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="${h}" rx="40" fill="url(#rg)" opacity="${morph}" stroke="#111" stroke-width="${6 * morph}"/>`;
  // shimmer travelling along ribbon
  if (morph > .5) { const sxp = lerp(x0, x1, (t * .4) % 1); s += `<rect x="${sxp - 40}" y="${y}" width="80" height="${h}" fill="#fff" opacity=".25"/>`; }
  // Sunny slides along with open palm
  const walk = eInOut(prog(t, 22.2, 25.9));
  const sx = lerp(380, 1540, walk);
  s += ch('sunny_present', sx, 1020, 560, t, { rot: 2 * Math.sin(t * 6) * (walk > 0 && walk < 1 ? 1 : 0) });
  return s;
}
function s6(t, a, b) {
  let s = bgStage('#FFF2F2', '#FFD9D9');
  const shake = 14 * Math.sin(t * 45) * (1 - prog(t, a, a + 1.2));
  const k = 1 + 0.12 * eOut(prog(t, a, a + .5));
  let inner = ch('blu_wave', 960 + shake, 1060, 700, t);
  // comic bounce lines
  inner += `<g stroke="#111" stroke-width="9" stroke-linecap="round"><path d="M 620 330 l -70 -40"/><path d="M 600 420 l -90 0"/><path d="M 1300 330 l 70 -40"/><path d="M 1320 420 l 90 0"/></g>`;
  inner += speechBubble(1400, 210, '?!', pop(t, a + .2), 110, '#FFE14D');
  s += cam(inner, k, 960, 600);
  return s;
}
function s7(t, a, b) {
  let s = bgStage('#FFF4DC', '#F5DDAF');
  const uk = eOut(prog(t, a + .1, a + 1.0));
  const X0 = 170, Y0 = 150, SW = 1180, SH = lerp(30, 700, uk);
  s += `<rect x="${X0}" y="${Y0}" width="${SW}" height="${SH}" rx="20" fill="#FBEBC6" stroke="#8A5A1F" stroke-width="8"/>
        <rect x="${X0 - 20}" y="${Y0 - 30}" width="${SW + 40}" height="50" rx="25" fill="#E2C285" stroke="#8A5A1F" stroke-width="8"/>
        <rect x="${X0 - 20}" y="${Y0 + SH - 20}" width="${SW + 40}" height="50" rx="25" fill="#E2C285" stroke="#8A5A1F" stroke-width="8"/>`;
  if (uk > .95) {
    // "300+ years ago" at 30.86
    const yk = pop(t, 30.8, .4);
    s += `<text x="${X0 + SW / 2}" y="${Y0 + 120}" text-anchor="middle" font-family="DejaVu Serif" font-style="italic" font-weight="bold" font-size="${74 * yk}" fill="#6B4416">300+ years ago…</text>`;
    // prism + beam
    const px = X0 + 470, py = Y0 + 440;
    s += `<polygon points="${X0 + 60},${py - 15} ${X0 + 60},${py + 15} ${px - 40},${py + 10} ${px - 40},${py - 10}" fill="#fff" stroke="#C9A86A" stroke-width="3"/>
          <polygon points="${px},${py - 130} ${px + 120},${py + 90} ${px - 120},${py + 90}" fill="#EAF6FF" stroke="#111" stroke-width="7" stroke-linejoin="round" opacity=".95"/>`;
    // 5 stripes at "first counted five"
    const five = ['#FF4D4D', '#FFE14D', '#4CD964', '#3FA9F5', '#A35BE0'];
    five.forEach((c, i) => {
      const k = eOut(prog(t, 32.9 + i * .18, 33.4 + i * .18));
      const sy = py - 70 + i * 40;
      s += `<rect x="${px + 90}" y="${sy}" width="${520 * k}" height="34" rx="8" fill="${c}" stroke="#111" stroke-width="4"/>`;
      if (k > .9) s += `<text class="cap" x="${px + 640}" y="${sy + 29}" font-size="34" fill="#6B4416">${i + 1}</text>`;
    });
    // quill writing
    const qx = X0 + 920 + 30 * Math.sin(t * 6), qy = Y0 + 180 + 12 * Math.cos(t * 9);
    s += `<g transform="translate(${qx},${qy}) rotate(35)"><path d="M 0 0 C 30 -120 90 -190 120 -230 C 70 -150 40 -60 8 6 Z" fill="#fff" stroke="#111" stroke-width="5"/><line x1="0" y1="0" x2="-20" y2="40" stroke="#111" stroke-width="6" stroke-linecap="round"/></g>`;
  }
  s += ch('sunny_point', 1620, 1020, 520, t, { flip: true });
  return s;
}
function s8(t, a, b) {
  let s = bgStage('#F4F0FF', '#E3D9FF');
  // staff
  const sx0 = 640, sx1 = 1820, sy = 330;
  for (let i = 0; i < 5; i++) s += `<line x1="${sx0}" y1="${sy + i * 45}" x2="${sx1}" y2="${sy + i * 45}" stroke="#7A6BB0" stroke-width="5" opacity=".6"/>`;
  // notes: first 5, then orange at 35.7, indigo at 36.3
  const order = [0, 1, 2, 3, 4, 5, 6];
  const appear = [a + .1, 35.7, a + .25, a + .4, a + .55, 36.3, a + .7]; // R,O,Y,G,B,I,V
  const n7 = clamp(prog(t, 36.3, 36.9));
  const n6 = clamp(prog(t, 35.7, 36.3));
  // compute positions: distribute visible notes evenly
  const vis = order.filter(i => t >= appear[i]);
  vis.forEach((i, j) => {
    const slots = vis.length;
    const x = lerp(sx0 + 90, sx1 - 90, slots === 1 ? .5 : j / (slots - 1));
    const k = pop(t, appear[i], .4);
    const bounce = t > 38.3 ? 30 * Math.abs(Math.sin((t - 38.3) * 6 + j * .6)) : 0;
    const ny = sy + 200 - i * 25 - bounce;
    const big = (i === 1 || i === 5) && t < appear[i] + 1.2 ? 1.25 : 1;
    s += `<g transform="translate(${x},${ny}) scale(${k * big})"><ellipse cx="0" cy="0" rx="36" ry="27" transform="rotate(-20)" fill="${RAIN[i]}" stroke="#111" stroke-width="6"/>
          <line x1="32" y1="-8" x2="32" y2="-150" stroke="#111" stroke-width="7" stroke-linecap="round"/><path d="M 32 -150 Q 80 -120 70 -70" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/></g>`;
  });
  // counter "= 7"
  if (t > 37.1) s += `<text class="cap" x="1230" y="860" text-anchor="middle" font-size="${150 * pop(t, 37.1)}" fill="#4B4BD8" stroke="#111" stroke-width="5">7</text>`;
  s += ch('sunny_present', 330, 1020, 560, t, { rot: t > 38.3 ? 4 * Math.sin(t * 6) : 0 });
  return s;
}
function s9(t, a, b) {
  let s = bgStage('#F0FFF4', '#D6F5E0');
  s += `<defs>${gradientDefs('rg2')}</defs>`;
  // eye
  const ek = pop(t, 40.15, .45);
  s += `<g transform="translate(420,380) scale(${ek})"><path d="M -200 0 Q 0 -150 200 0 Q 0 150 -200 0 Z" fill="#fff" stroke="#111" stroke-width="9"/>
        <circle r="80" fill="#6EC1FF" stroke="#111" stroke-width="7"/><circle r="38" fill="#111"/><circle cx="-18" cy="-20" r="12" fill="#fff"/></g>`;
  // three sensors R G B
  ['#FF4D4D', '#4CD964', '#3FA9F5'].forEach((c, i) => {
    const k = pop(t, 40.85 + i * .18, .35);
    s += `<circle cx="${300 + i * 120}" cy="590" r="${36 * k}" fill="${c}" stroke="#111" stroke-width="6"/>`;
  });
  // arrow + brain
  const bk = pop(t, 42.8, .45);
  if (t > 42.7) {
    s += `<path d="M 680 380 L ${lerp(680, 1080, eOut(prog(t, 42.7, 43.2)))} 380" stroke="#111" stroke-width="12" stroke-linecap="round"/>`;
    s += `<g transform="translate(1340,380) scale(${bk})"><path d="M -160 30 C -200 -60 -140 -150 -60 -150 C -20 -200 60 -200 90 -150 C 170 -150 210 -60 170 20 C 200 90 130 150 60 130 C 20 170 -60 170 -90 130 C -170 140 -210 80 -160 30 Z" fill="#FFB3C7" stroke="#111" stroke-width="9"/>
      <path d="M 0 -170 C -20 -100 20 -60 0 0 C -20 60 20 100 0 150" fill="none" stroke="#111" stroke-width="7"/><path d="M -110 -60 q 40 20 70 0 M 50 -70 q 40 25 80 0 M -100 60 q 40 -25 80 0 M 40 60 q 40 20 80 0" fill="none" stroke="#C2577A" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="-50" cy="-30" rx="10" ry="16" fill="#111"/><ellipse cx="50" cy="-30" rx="10" ry="16" fill="#111"/><path d="M -40 20 Q 0 60 40 20" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/></g>`;
    // name tags flying in at "sorting things into names"
    const nk = eOut(prog(t, 43.7, 44.9));
    ['RED', 'GREEN', 'BLUE'].forEach((nm, i) => {
      if (nk > 0) s += `<g opacity="${nk}" transform="translate(${1560 + 40 * (1 - nk)},${260 + i * 95})"><rect x="0" y="-38" width="230" height="70" rx="35" fill="#fff" stroke="#111" stroke-width="5"/><text class="cap" x="115" y="12" text-anchor="middle" font-size="38" fill="${['#E8262B', '#2E9E46', '#1C7FD6'][i]}">${nm}</text></g>`;
    });
  }
  // bottom: gradient -> stripes ("see stripes") -> gradient ("paints a gradient")
  const appearK = eOut(prog(t, 45.2, 45.7));
  const split = eInOut(prog(t, 45.9, 46.5)) * (1 - eInOut(prog(t, 47.4, 48.2)));
  const x0 = 260, x1 = 1660, y = 760, h = 130, bw = (x1 - x0) / 7;
  if (appearK > 0) {
    s += `<g opacity="${appearK}">`;
    s += `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="${h}" rx="32" fill="url(#rg2)" stroke="#111" stroke-width="6" opacity="${1 - split}"/>`;
    RAIN.forEach((c, i) => {
      const gap = 24 * split;
      s += `<rect x="${x0 + i * bw + gap / 2}" y="${y}" width="${bw - gap}" height="${h}" rx="18" fill="${c}" stroke="#111" stroke-width="6" opacity="${split}"/>`;
    });
    s += `</g>`;
  }
  s += ch('sunny_point', 1760, 1060, 400, t, { flip: true });
  return s;
}
function s10(t, a, b) {
  const p = prog(t, a, 55.6);
  let s = bgHill(t, 1);
  s += ch('blu_think', 760, 1000, 560, t, { rot: t > 51.8 ? 4 * Math.sin(t * 5) : 0 });
  s += ch(t > 52.0 ? 'sunny_wave' : 'sunny_present', 1180, 1000, 600, t);
  const qk = pop(t, 53.0, .5);
  if (t > 52.9) s += speechBubble(960, 190, 'Comment your WHY?', qk, 66, '#FFE14D');
  if (t > 49.6 && t < 52) s += speechBubble(620, 320, 'Just a label?', pop(t, 49.7, .4), 54);
  return cam(s, 1.07 - 0.07 * eInOut(p), 960, 640);
}

// ---------- captions (karaoke) ----------
function captions(t) {
  // group words into chunks of <=6, breaking at punctuation
  if (!window._chunks) {
    const ch = []; let cur = [];
    WORDS.forEach(w => { cur.push(w); if (cur.length >= 6 || /[.?!,…]$/.test(w.w) && cur.length >= 3 || /[.?!]$/.test(w.w)) { ch.push(cur); cur = []; } });
    if (cur.length) ch.push(cur);
    window._chunks = ch;
  }
  const c = window._chunks.find((cw, i) => t >= cw[0].s - .12 && t <= (window._chunks[i + 1] ? Math.min(window._chunks[i + 1][0].s - .12, cw[cw.length - 1].e + .6) : cw[cw.length - 1].e + .8));
  if (!c) return '';
  const fs = 54;
  const text = c.map(w => `<tspan fill="${t >= w.s - .03 ? '#FFE14D' : '#FFFFFF'}">${w.w.replace(/&/g, '&amp;').replace(/</g, '&lt;')} </tspan>`).join('');
  const len = c.map(w => w.w).join(' ').length * fs * 0.56 + 60;
  return `<g><rect x="${960 - len / 2}" y="${H - 132}" width="${len}" height="88" rx="44" fill="#111" opacity=".78"/>
    <text class="cap" x="960" y="${H - 70}" text-anchor="middle" font-size="${fs}">${text}</text></g>`;
}

window.render = function (t) {
  const sc = SCENES.find(s => t >= s.a && t < s.b) || SCENES[SCENES.length - 1];
  let out = sc.f(t, sc.a, sc.b);
  // quick white flash at each cut
  const since = t - sc.a;
  if (sc.a > 0 && since < .18) out += `<rect width="${W}" height="${H}" fill="#fff" opacity="${1 - since / .18}"/>`;
  out += captions(t);
  // channel bug
  out += `<g opacity=".9"><rect x="1660" y="34" width="226" height="56" rx="28" fill="#111" opacity=".7"/><text class="cap" x="1773" y="72" text-anchor="middle" font-size="30" fill="#FFE14D">Blu &amp; Sunny</text></g>`;
  // end fade
  if (t > 55.2) out += `<rect width="${W}" height="${H}" fill="#fff" opacity="${clamp((t - 55.2) / .36)}"/>`;
  document.getElementById('stage').innerHTML = out;
};
window.render(0);
